<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradientes -->
                <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#14241a"/>
                    <stop offset="100%" stop-color="#090c0a"/>
                </radialGradient>

                <linearGradient id="solidGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0f5934"/>
                    <stop offset="100%" stop-color="#083820"/>
                </linearGradient>

                <linearGradient id="midGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#34b373"/>
                    <stop offset="100%" stop-color="#196b43"/>
                </linearGradient>

                <linearGradient id="lightGreen" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#5cdb97"/>
                    <stop offset="100%" stop-color="#2ca866"/>
                </linearGradient>

                <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#73f0b0"/>
                    <stop offset="50%" stop-color="#2ba366"/>
                    <stop offset="100%" stop-color="#094025"/>
                </radialGradient>

                <!-- Filtro de textura leve se necessário -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <g transform="translate(0, 0)">
                <!-- ================= LINHAS PONTILHADAS DE ÓRBITA/REDE ================= -->
                <path d="M 400 120 A 280 280 0 0 1 680 400" fill="none" stroke="#2da866" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.6"/>
                <path d="M 400 180 A 220 220 0 0 1 620 400" fill="none" stroke="#2da866" stroke-width="2" stroke-dasharray="3 5" opacity="0.5"/>
                <path d="M 400 240 A 160 160 0 0 1 560 400" fill="none" stroke="#2da866" stroke-width="2" stroke-dasharray="3 5" opacity="0.4"/>
                <path d="M 400 680 A 280 280 0 0 0 680 400" fill="none" stroke="#2da866" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.6"/>
                <path d="M 400 620 A 220 220 0 0 0 620 400" fill="none" stroke="#2da866" stroke-width="2" stroke-dasharray="3 5" opacity="0.5"/>

                <!-- ================= CONEXÕES MOLECULARES (CONEXÕES / LIGAÇÕES) ================= -->
                <g stroke="#d8d3c5" stroke-width="2.5" opacity="0.75" stroke-linecap="round">
                    <!-- Conexões principais estendendo para a direita -->
                    <line x1="480" y1="210" x2="525" y2="140"/>
                    <line x1="525" y1="140" x2="655" y2="235"/>
                    <line x1="655" y1="235" x2="680" y2="380"/>
                    <line x1="680" y1="380" x2="630" y2="520"/>
                    <line x1="630" y1="520" x2="560" y2="590"/>
                    <line x1="560" y1="590" x2="525" y2="690"/>
                    
                    <!-- Rede interna de ramificações -->
                    <line x1="490" y1="320" x2="575" y2="280"/>
                    <line x1="575" y1="280" x2="655" y2="235"/>
                    <line x1="575" y1="280" x2="630" y2="520"/>
                    <line x1="490" y1="460" x2="540" y2="475"/>
                    <line x1="540" y1="475" x2="630" y2="520"/>
                    <line x1="540" y1="475" x2="565" y2="590"/>
                    <line x1="445" y1="240" x2="525" y2="140"/>
                    <line x1="440" y1="580" x2="525" y2="690"/>
                    <line x1="460" y1="630" x2="525" y2="690"/>
                </g>

                <!-- ================= ESTRUTURA SÓLIDA ORGÂNICA (ESQUERDA) ================= -->
                <!-- Bloco semi-circular base escuro -->
                <path d="M 400 120 C 220 120 120 230 120 400 C 120 570 220 680 400 680 C 370 610 360 520 375 440 C 340 430 310 400 310 360 C 310 315 345 280 390 280 C 375 220 380 160 400 120 Z" 
                      fill="url(#solidGreen)"/>

                <!-- Pétala/Segmento Médio Superior -->
                <path d="M 390 125 C 440 135 480 180 475 235 C 430 260 380 230 385 170 Z" 
                      fill="url(#midGreen)"/>

                <!-- Pétala/Segmento Médio Inferior -->
                <path d="M 395 675 C 445 665 485 620 470 565 C 420 545 375 575 385 630 Z" 
                      fill="url(#midGreen)"/>

                <!-- Nódulo central principal (Esfera com gradiente 3D) -->
                <circle cx="310" cy="400" r="75" fill="url(#sphereGrad)" filter="url(#glow)"/>
                <circle cx="310" cy="400" r="75" fill="none" stroke="#2da866" stroke-width="2" opacity="0.6"/>

                <!-- ================= FRAGMENTOS DE DECOMPOSIÇÃO (MEIO) ================= -->
                <!-- Blocos poligonais em transição de desintegração -->
                <path d="M 385 270 Q 430 250 460 290 Q 480 340 430 365 Q 390 350 385 270 Z" fill="url(#lightGreen)"/>
                <path d="M 470 340 Q 520 310 550 360 Q 550 420 495 430 Q 460 390 470 340 Z" fill="url(#lightGreen)"/>
                <path d="M 400 380 Q 440 370 465 410 Q 460 470 415 480 Q 380 440 400 380 Z" fill="url(#midGreen)"/>
                <path d="M 480 450 Q 545 440 570 500 Q 550 565 485 550 Q 465 490 480 450 Z" fill="url(#lightGreen)"/>
                <path d="M 405 500 Q 450 490 470 540 Q 445 610 395 590 Q 385 540 405 500 Z" fill="url(#midGreen)"/>

                <!-- Pequenos fragmentos se soltando (Lise) -->
                <path d="M 390 620 Q 420 610 440 640 Q 420 670 395 660 Z" fill="url(#lightGreen)"/>
                <path d="M 440 200 Q 470 190 485 220 Q 460 245 435 230 Z" fill="url(#midGreen)"/>

                <!-- ================= ILUSTRAÇÃO FOLIAR (RAMO VEGETAL) ================= -->
                <!-- Ramo principal com curva orgânica refinada -->
                <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
                    <path d="M 350 670 C 260 610 200 480 200 390 C 200 280 270 170 345 130" stroke-width="3"/>
                    
                    <!-- Folhas esquerdas -->
                    <path d="M 325 140 C 280 145 250 120 240 100 C 260 135 295 155 325 140 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 290 185 C 230 180 200 150 185 130 C 210 170 250 195 290 185 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 245 255 C 180 235 145 200 135 175 C 160 220 205 255 245 255 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 215 340 C 145 310 120 275 110 240 C 130 290 175 330 215 340 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 205 430 C 135 410 115 365 110 330 C 125 380 165 420 205 430 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 215 520 C 150 520 120 480 115 440 C 135 485 175 515 215 520 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 250 600 C 190 620 155 590 145 560 C 170 595 210 615 250 600 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 305 650 C 260 680 225 660 210 635 C 235 660 275 670 305 650 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>

                    <!-- Folhas direitas (internas) -->
                    <path d="M 335 160 C 320 200 340 230 355 240 C 345 210 335 185 335 160 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 270 215 C 270 255 300 280 320 290 C 295 270 280 245 270 215 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 230 300 C 245 340 275 365 295 370 C 270 355 250 330 230 300 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 210 385 C 235 420 265 435 290 440 C 260 425 240 405 210 385 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 210 475 C 240 500 270 510 295 505 C 265 495 240 485 210 475 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                    <path d="M 230 560 C 270 575 295 570 315 560 C 285 555 260 550 230 560 Z" fill="#ffffff" fill-opacity="0.1" stroke-width="2"/>
                </g>

                <!-- ================= NÓDULOS / ÁTOMOS DA REDE (DIREITA) ================= -->
                <g filter="url(#glow)">
                    <!-- Nódulos com tons de verde -->
                    <circle cx="525" cy="140" r="16" fill="#f5c2b3"/> <!-- Destaque rosa/salmão superior -->
                    <circle cx="655" cy="235" r="26" fill="url(#midGreen)"/>
                    <circle cx="680" cy="380" r="22" fill="#8beec1"/>
                    <circle cx="630" cy="520" r="24" fill="url(#midGreen)"/>
                    <circle cx="560" cy="590" r="14" fill="#7ce4ad"/>
                    <circle cx="525" cy="690" r="16" fill="#f5c2b3"/> <!-- Destaque rosa/salmão inferior -->
                    
                    <!-- Nódulos intermediários -->
                    <circle cx="445" cy="240" r="20" fill="url(#midGreen)"/>
                    <circle cx="480" cy="210" r="10" fill="#7ce4ad"/>
                    <circle cx="575" cy="280" r="22" fill="url(#midGreen)"/>
                    <circle cx="490" cy="320" r="12" fill="#52c98d"/>
                    <circle cx="540" cy="475" r="18" fill="url(#midGreen)"/>
                    <circle cx="490" cy="460" r="10" fill="#7ce4ad"/>
                    <circle cx="440" cy="580" r="16" fill="url(#midGreen)"/>
                    <circle cx="460" cy="630" r="10" fill="#52c98d"/>
                </g>
            </g>
        </svg>